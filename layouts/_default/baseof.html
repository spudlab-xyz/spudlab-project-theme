<!doctype html>
<html lang="{{ site.Language.LanguageCode | default site.Language.Lang }}" data-theme="auto">
  <head>
    {{ partial "head.html" . }}
  </head>
  <body>
    <a class="skip-link" href="#main-content">{{ i18n "skipToContent" }}</a>
    {{ partial "header.html" . }}
    <main id="main-content" tabindex="-1">
      {{ block "main" . }}{{ end }}
    </main>
    {{ partial "footer.html" . }}
    {{ partial "scripts.html" . }}
  </body>
</html>
